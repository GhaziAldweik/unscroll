# Runs the unit tests and builds a debug APK on every push and pull request.
# The debug APK is signed with a throwaway debug key, so it will not install over the
# release APK from the Releases page; it is for checking that the project builds.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain

      - name: Check that no internet permission crept in
        run: |
          manifest=app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
          test -f "$manifest"
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "::error::The merged manifest requests INTERNET."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: unscroll-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
